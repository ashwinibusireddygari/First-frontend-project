<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shooper Template</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        .Brand-title span
        {
            font-weight: bold;
            font-size: 20px;
        }
        header
        {
            font-size: 23px;
            font-family: Arial;
            padding: 10px;
            display: flex;
             justify-content: space-around;
        }
        nav span
        {
         margin-right: 10px;
        }
        .Shortcut-icons span{
            margin-right: 10px;
        }
        article {
            font-size: 10px;
            background-color: black;
            color: white;
            text-align: center;
            padding: 10px;
        }
        .bi-lightning-fill {
            color: gold;
        }
       
    </style>
</head>
<body>
    <header>
    <div>
     <span class="Brand-title"> Shopper.</span>
    </div>
    <nav>
    <span>Home</span>
     <span>Catalog</span>
     <span>Shop</span>
     <span>Pages</span>
     <span>Blog</span>
     <span>Docs</span>
    </nav>
    
    <div class="Shortcut-icons">
    <span class="bi bi-search"></span>
    <span class="bi bi-person"></span>
    <span class="bi bi-heart"></span>
    <span class="bi bi-cart"></span>
    </div>
    </header>
   <article>
    <span class="bi bi-lightning-fill"></span>
    <span>HAPPY HOLIDAYS DEAL ON EVERYTHING</span>
    <span class="bi bi-lightning-fill"></span>
   </article>
</body>
</html>
